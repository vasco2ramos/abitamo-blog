<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="O que dizia cada decreto" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><g font-family="Arial, sans-serif"><rect width="1200" height="760" rx="24" fill="#f1f5f9"/><text x="60" y="95" font-size="46" font-weight="700" fill="#1e3c72">O que dizia cada decreto</text><rect x="60" y="150" width="520" height="520" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="60" y="150" width="520" height="100" rx="26" fill="#1e3c72"/><rect x="60" y="210" width="520" height="40" fill="#1e3c72"/><text x="90" y="198" font-size="34" font-weight="700" fill="#fff">RDL 26/2026</text><text x="90" y="232" font-size="22" fill="#fff" fill-opacity="0.85">Rendas, prorrogação e despejos</text><circle cx="96" cy="298" r="7" fill="#1e3c72"/><text x="118" y="306" font-size="25" fill="#3D405B">Aumento da renda: máximo 2%</text><circle cx="96" cy="362" r="7" fill="#1e3c72"/><text x="118" y="370" font-size="25" fill="#3D405B">Prorrogação extraordinária:</text><text x="118" y="400" font-size="25" fill="#3D405B">até 2 anos</text><circle cx="96" cy="456" r="7" fill="#1e3c72"/><text x="118" y="464" font-size="25" fill="#3D405B">Despejos de pessoas vulneráveis</text><text x="118" y="494" font-size="25" fill="#3D405B">suspensos até 2030</text><circle cx="96" cy="550" r="7" fill="#1e3c72"/><text x="118" y="558" font-size="25" fill="#3D405B">Compras especulativas:</text><text x="118" y="588" font-size="25" fill="#3D405B">só abaixo de 70%</text><text x="118" y="618" font-size="25" fill="#3D405B">do valor de mercado</text><rect x="620" y="150" width="520" height="520" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="620" y="150" width="520" height="100" rx="26" fill="#2a5298"/><rect x="620" y="210" width="520" height="40" fill="#2a5298"/><text x="650" y="198" font-size="34" font-weight="700" fill="#fff">RDL 27/2026</text><text x="650" y="232" font-size="22" fill="#fff" fill-opacity="0.85">Estabilidade do contrato</text><circle cx="656" cy="298" r="7" fill="#2a5298"/><text x="678" y="306" font-size="25" fill="#3D405B">Renovação automática:</text><text x="678" y="336" font-size="25" fill="#3D405B">5 anos (7 se o senhorio</text><text x="678" y="366" font-size="25" fill="#3D405B">for uma empresa)</text><circle cx="656" cy="422" r="7" fill="#2a5298"/><text x="678" y="430" font-size="25" fill="#3D405B">Aviso do senhorio:</text><text x="678" y="460" font-size="25" fill="#3D405B">6 meses</text><circle cx="656" cy="516" r="7" fill="#2a5298"/><text x="678" y="524" font-size="25" fill="#3D405B">Aviso do inquilino:</text><text x="678" y="554" font-size="25" fill="#3D405B">2 meses</text><circle cx="656" cy="610" r="7" fill="#2a5298"/><text x="678" y="618" font-size="25" fill="#3D405B">Indemnização se não renova:</text><text x="678" y="648" font-size="25" fill="#3D405B">pelo menos 12 rendas</text><rect x="60" y="690" width="640" height="48" rx="24" fill="#ef4444"/><text x="380" y="723" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Revogados pelo Congresso a 2 de outubro de 2026</text><text x="1140" y="723" text-anchor="end" font-size="22" fill="#64748b">Fonte: BOE</text></g></svg>