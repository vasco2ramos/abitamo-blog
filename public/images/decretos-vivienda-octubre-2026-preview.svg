<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Línea de tiempo: 29 de septiembre aprobación de los decretos, 2 de octubre derogación en el Congreso, 5 de octubre convocatoria de elecciones, 6 de octubre nueva aprobación prevista, 29 de noviembre elecciones" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
