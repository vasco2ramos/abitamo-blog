<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Panel de datos del mercado del alquiler con un gráfico de barras y un documento verificado">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2147" stop-opacity="0" />
      <stop offset="100%" stop-color="#0f2147" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- distant skyline, dim -->
  <g opacity="0.14" fill="#ffffff">
    <rect x="1190" y="540" width="42" height="240" />
    <rect x="1242" y="490" width="32" height="290" />
    <rect x="1284" y="580" width="48" height="200" />
    <rect x="1342" y="440" width="38" height="340" />
    <rect x="1390" y="520" width="28" height="260" />
    <rect x="1428" y="470" width="44" height="310" />
    <rect x="1482" y="560" width="34" height="220" />
  </g>

  <rect x="0" y="700" width="1600" height="200" fill="url(#floor)" />

  <!-- main data panel: rent-index bar chart trending up -->
  <g transform="translate(780 150) rotate(-3)">
    <rect x="0" y="0" width="560" height="460" rx="24" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

    <text x="40" y="56" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#0ea5e9" font-weight="700">ÍNDICE DE ALQUILER</text>
    <text x="40" y="84" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="700">+6,8% interanual</text>

    <!-- bars -->
    <g>
      <rect x="48"  y="330" width="52" height="80"  rx="6" fill="url(#bar)" fill-opacity="0.55" />
      <rect x="120" y="300" width="52" height="110" rx="6" fill="url(#bar)" fill-opacity="0.65" />
      <rect x="192" y="270" width="52" height="140" rx="6" fill="url(#bar)" fill-opacity="0.75" />
      <rect x="264" y="230" width="52" height="180" rx="6" fill="url(#bar)" fill-opacity="0.85" />
      <rect x="336" y="190" width="52" height="220" rx="6" fill="url(#bar)" />
      <rect x="408" y="150" width="52" height="260" rx="6" fill="url(#bar)" />
    </g>
    <!-- trend line -->
    <polyline points="74,330 146,300 218,270 290,230 362,190 434,150" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <circle cx="434" cy="150" r="7" fill="#ffffff" />

    <rect x="40" y="410" width="480" height="1" fill="#ffffff" fill-opacity="0.2" />
    <text x="40" y="438" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.55">idealista/data &#183; INE &#183; Fotocasa Research</text>
  </g>

  <!-- verified-document badge, floating lower-right of the main panel -->
  <g transform="translate(1160 500)">
    <rect x="0" y="0" width="260" height="180" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
    <g transform="translate(30 34)">
      <rect x="0" y="0" width="70" height="90" rx="8" fill="#ffffff" fill-opacity="0.18" />
      <rect x="12" y="16" width="46" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.5" />
      <rect x="12" y="32" width="46" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35" />
      <rect x="12" y="48" width="30" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35" />
      <circle cx="58" cy="70" r="18" fill="#10b981" filter="url(#soft)" opacity="0.5" />
      <circle cx="58" cy="70" r="15" fill="#10b981" />
      <path d="M 50 70 L 55 76 L 68 60" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
    <text x="118" y="60" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.55">Certificado</text>
    <text x="118" y="80" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.9" font-weight="600">Verificado</text>
    <text x="118" y="112" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.55">Mercados</text>
    <text x="118" y="132" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.9" font-weight="600">España &#183; Portugal</text>
  </g>
</svg>
