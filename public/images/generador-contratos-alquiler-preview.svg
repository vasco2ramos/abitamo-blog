<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contrato de alquiler generado en PDF, con cláusulas opcionales seleccionables y un sello de validez legal">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2147" stop-opacity="0" />
      <stop offset="100%" stop-color="#0f2147" stop-opacity="0.55" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- distant skyline, right side, kept dim -->
  <g opacity="0.15" fill="#ffffff">
    <rect x="1180" y="520" width="46" height="260" />
    <rect x="1236" y="470" width="34" height="310" />
    <rect x="1280" y="560" width="52" height="220" />
    <rect x="1342" y="420" width="40" height="360" />
    <rect x="1392" y="500" width="30" height="280" />
    <rect x="1432" y="450" width="46" height="330" />
    <rect x="1488" y="540" width="36" height="240" />
  </g>

  <rect x="0" y="700" width="1600" height="200" fill="url(#floor)" />

  <!-- floating glass document panel: the generated contract -->
  <g transform="translate(760 120) rotate(-4)">
    <rect x="0" y="0" width="560" height="600" rx="24" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

    <!-- document header -->
    <rect x="48" y="56" width="240" height="18" rx="9" fill="#ffffff" fill-opacity="0.55" />
    <rect x="48" y="90" width="160" height="12" rx="6" fill="#ffffff" fill-opacity="0.3" />

    <!-- intro paragraph lines -->
    <g fill="#ffffff" fill-opacity="0.22">
      <rect x="48" y="140" width="464" height="10" rx="5" />
      <rect x="48" y="168" width="464" height="10" rx="5" />
      <rect x="48" y="196" width="360" height="10" rx="5" />
    </g>

    <!-- optional-clause chips, one click each -->
    <text x="48" y="248" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#0ea5e9" font-weight="700">+</text>
    <g transform="translate(48 260)">
      <!-- pets -->
      <g>
        <rect x="0" y="0" width="80" height="64" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" />
        <g transform="translate(40 30)" fill="#60a5fa">
          <ellipse cx="0" cy="6" rx="11" ry="9" />
          <ellipse cx="-14" cy="-8" rx="5" ry="6" />
          <ellipse cx="14" cy="-8" rx="5" ry="6" />
          <ellipse cx="-8" cy="-16" rx="4.5" ry="5.5" />
          <ellipse cx="8" cy="-16" rx="4.5" ry="5.5" />
        </g>
      </g>
      <!-- remote work -->
      <g transform="translate(92 0)">
        <rect x="0" y="0" width="80" height="64" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" />
        <g transform="translate(40 34)" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round">
          <path d="M -18 -6 A 26 26 0 0 1 18 -6" />
          <path d="M -10 2 A 15 15 0 0 1 10 2" />
          <circle cx="0" cy="10" r="3.5" fill="#60a5fa" stroke="none" />
        </g>
      </g>
      <!-- parking -->
      <g transform="translate(184 0)">
        <rect x="0" y="0" width="80" height="64" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" />
        <rect x="26" y="12" width="28" height="40" rx="6" fill="#60a5fa" />
        <text x="40" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">P</text>
      </g>
      <!-- guarantor -->
      <g transform="translate(276 0)">
        <rect x="0" y="0" width="80" height="64" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" />
        <g transform="translate(40 32)" fill="#60a5fa">
          <circle cx="0" cy="-10" r="9" />
          <path d="M -16 20 C -16 4 16 4 16 20 Z" />
        </g>
      </g>
      <!-- early termination -->
      <g transform="translate(368 0)">
        <rect x="0" y="0" width="80" height="64" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" />
        <g transform="translate(40 32)">
          <rect x="-16" y="-14" width="32" height="28" rx="4" fill="none" stroke="#60a5fa" stroke-width="3" />
          <path d="M -16 -6 L 16 -6" stroke="#60a5fa" stroke-width="3" />
          <path d="M -7 2 L 7 14 M 7 2 L -7 14" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
        </g>
      </g>
    </g>

    <!-- closing lines -->
    <g fill="#ffffff" fill-opacity="0.22">
      <rect x="48" y="356" width="464" height="10" rx="5" />
      <rect x="48" y="384" width="420" height="10" rx="5" />
    </g>

    <rect x="48" y="424" width="464" height="1" fill="#ffffff" fill-opacity="0.2" />

    <!-- two signature lines -->
    <g transform="translate(48 460)">
      <path d="M 0 20 C 10 0, 20 32, 32 12 S 52 0, 64 16" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" />
      <rect x="0" y="34" width="140" height="1.5" fill="#ffffff" fill-opacity="0.35" />
    </g>
    <g transform="translate(348 460)">
      <path d="M 0 16 C 10 32, 20 0, 32 12 S 52 32, 64 20" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" />
      <rect x="0" y="34" width="140" height="1.5" fill="#ffffff" fill-opacity="0.35" />
    </g>

    <!-- validated checkmark badge -->
    <g transform="translate(496 40)">
      <circle cx="0" cy="0" r="34" fill="#10b981" filter="url(#soft)" opacity="0.55" />
      <circle cx="0" cy="0" r="30" fill="#10b981" />
      <path d="M -13 0 L -4 10 L 15 -12" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- side stat panel: speed + jurisdictions -->
  <g transform="translate(1180 500)">
    <rect x="0" y="0" width="300" height="240" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

    <text x="150" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="76" font-weight="700" fill="#0ea5e9">&lt;5</text>
    <text x="150" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="2" fill="#ffffff" fill-opacity="0.6" font-weight="700">MINUTOS</text>

    <rect x="24" y="140" width="252" height="1" fill="#ffffff" fill-opacity="0.2" />

    <g transform="translate(50 190)">
      <circle r="16" fill="#dbeafe" />
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">ES</text>
    </g>
    <text x="150" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.5" font-weight="700">&#183;</text>
    <g transform="translate(250 190)">
      <circle r="16" fill="#dbeafe" />
      <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">PT</text>
    </g>
    <text x="150" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.55">LAU &#183; NRAU, autodetectado</text>
  </g>
</svg>
