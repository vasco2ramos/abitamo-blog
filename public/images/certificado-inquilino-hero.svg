<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Documento de empleo siendo analizado por IA, con un check de verificación">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2147" stop-opacity="0" />
      <stop offset="100%" stop-color="#0f2147" stop-opacity="0.55" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="softSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- distant skyline, right side, kept dim -->
  <g opacity="0.16" fill="#ffffff">
    <rect x="1180" y="520" width="46" height="260" />
    <rect x="1236" y="470" width="34" height="310" />
    <rect x="1280" y="560" width="52" height="220" />
    <rect x="1342" y="420" width="40" height="360" />
    <rect x="1392" y="500" width="30" height="280" />
    <rect x="1432" y="450" width="46" height="330" />
    <rect x="1488" y="540" width="36" height="240" />
    <rect x="1534" y="480" width="44" height="300" />
  </g>

  <!-- soft floor glow -->
  <rect x="0" y="700" width="1600" height="200" fill="url(#floor)" />

  <!-- floating glass document panel -->
  <g transform="translate(760 160) rotate(-4)">
    <rect x="0" y="0" width="560" height="620" rx="24" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

    <!-- document header -->
    <rect x="48" y="56" width="220" height="18" rx="9" fill="#ffffff" fill-opacity="0.55" />
    <rect x="48" y="90" width="150" height="12" rx="6" fill="#ffffff" fill-opacity="0.3" />

    <!-- document body lines -->
    <g fill="#ffffff" fill-opacity="0.22">
      <rect x="48" y="140" width="464" height="10" rx="5" />
      <rect x="48" y="168" width="464" height="10" rx="5" />
      <rect x="48" y="196" width="380" height="10" rx="5" />
      <rect x="48" y="240" width="464" height="10" rx="5" />
      <rect x="48" y="268" width="420" height="10" rx="5" />
      <rect x="48" y="296" width="464" height="10" rx="5" />
      <rect x="48" y="324" width="300" height="10" rx="5" />
    </g>

    <!-- scanning band -->
    <rect x="24" y="320" width="512" height="90" fill="url(#scan)" filter="url(#softSm)" />
    <rect x="24" y="360" width="512" height="4" fill="#0ea5e9" fill-opacity="0.85" />

    <g fill="#ffffff" fill-opacity="0.22">
      <rect x="48" y="392" width="464" height="10" rx="5" />
      <rect x="48" y="420" width="464" height="10" rx="5" />
      <rect x="48" y="448" width="340" height="10" rx="5" />
    </g>

    <!-- verified checkmark badge -->
    <g transform="translate(464 40)">
      <circle cx="0" cy="0" r="34" fill="#10b981" filter="url(#soft)" opacity="0.55" />
      <circle cx="0" cy="0" r="30" fill="#10b981" />
      <path d="M -13 0 L -4 10 L 15 -12" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- extracted-data side panel -->
  <g transform="translate(1180 520)">
    <rect x="0" y="0" width="300" height="220" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
    <text x="24" y="38" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#0ea5e9" font-weight="700">EXTRACTED DATA</text>

    <text x="24" y="76" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.55">Employer</text>
    <text x="24" y="96" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.9" font-weight="600">Global Solutions Inc.</text>

    <text x="24" y="128" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.55">Job Title</text>
    <text x="24" y="148" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.9" font-weight="600">Senior Engineer</text>

    <text x="24" y="180" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.55">Verified Income</text>
    <text x="24" y="200" font-family="Arial, sans-serif" font-size="15" fill="#10b981" font-weight="700">Match ✓</text>
  </g>
</svg>
