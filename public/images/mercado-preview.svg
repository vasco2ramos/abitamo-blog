<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anillo de progreso mostrando el 48% de propietarios que desconfían de los inquilinos, sobre un fondo degradado">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- 48% ring (conic approximated as an arc path, ~48% of a circle) -->
  <g transform="translate(1080 450)">
    <circle r="260" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="34" />
    <circle r="260" fill="none" stroke="#0ea5e9" stroke-opacity="0.35" stroke-width="34" filter="url(#soft)" />
    <path
      d="M 0 -260 A 260 260 0 0 1 -33.9 258.8"
      fill="none"
      stroke="#0ea5e9"
      stroke-width="34"
      stroke-linecap="round"
    />
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="700" fill="#ffffff">48%</text>
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" fill-opacity="0.7">de propietarios desconfían</text>
  </g>

  <!-- small bar accents, lower area, echoing the page's own bar charts -->
  <g transform="translate(120 700)" fill="#60a5fa" fill-opacity="0.6">
    <rect x="0" y="40" width="26" height="60" rx="4" />
    <rect x="38" y="10" width="26" height="90" rx="4" />
    <rect x="76" y="-30" width="26" height="130" rx="4" fill="#0ea5e9" fill-opacity="0.85" />
  </g>
  <text x="120" y="740" font-family="Arial, sans-serif" font-size="24" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.55" font-weight="700">MERCADO DEL ALQUILER</text>
  <text x="120" y="775" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">España · Portugal 2026</text>
</svg>
