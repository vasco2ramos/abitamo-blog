<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What each decree said" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><g font-family="Arial, sans-serif"><rect width="1200" height="760" rx="24" fill="#f1f5f9"/><text x="60" y="95" font-size="46" font-weight="700" fill="#1e3c72">What each decree said</text><rect x="60" y="150" width="520" height="520" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="60" y="150" width="520" height="100" rx="26" fill="#1e3c72"/><rect x="60" y="210" width="520" height="40" fill="#1e3c72"/><text x="90" y="198" font-size="34" font-weight="700" fill="#fff">RDL 26/2026</text><text x="90" y="232" font-size="22" fill="#fff" fill-opacity="0.85">Rent, extension and evictions</text><circle cx="96" cy="298" r="7" fill="#1e3c72"/><text x="118" y="306" font-size="25" fill="#3D405B">Rent increase: 2% maximum</text><circle cx="96" cy="362" r="7" fill="#1e3c72"/><text x="118" y="370" font-size="25" fill="#3D405B">Extraordinary extension:</text><text x="118" y="400" font-size="25" fill="#3D405B">up to 2 years</text><circle cx="96" cy="456" r="7" fill="#1e3c72"/><text x="118" y="464" font-size="25" fill="#3D405B">Evictions of vulnerable people</text><text x="118" y="494" font-size="25" fill="#3D405B">suspended until 2030</text><circle cx="96" cy="550" r="7" fill="#1e3c72"/><text x="118" y="558" font-size="25" fill="#3D405B">Speculative purchases:</text><text x="118" y="588" font-size="25" fill="#3D405B">only below 70%</text><text x="118" y="618" font-size="25" fill="#3D405B">of market value</text><rect x="620" y="150" width="520" height="520" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="620" y="150" width="520" height="100" rx="26" fill="#2a5298"/><rect x="620" y="210" width="520" height="40" fill="#2a5298"/><text x="650" y="198" font-size="34" font-weight="700" fill="#fff">RDL 27/2026</text><text x="650" y="232" font-size="22" fill="#fff" fill-opacity="0.85">Contract stability</text><circle cx="656" cy="298" r="7" fill="#2a5298"/><text x="678" y="306" font-size="25" fill="#3D405B">Automatic renewal:</text><text x="678" y="336" font-size="25" fill="#3D405B">5 years (7 if the landlord</text><text x="678" y="366" font-size="25" fill="#3D405B">is a company)</text><circle cx="656" cy="422" r="7" fill="#2a5298"/><text x="678" y="430" font-size="25" fill="#3D405B">Landlord notice:</text><text x="678" y="460" font-size="25" fill="#3D405B">6 months</text><circle cx="656" cy="516" r="7" fill="#2a5298"/><text x="678" y="524" font-size="25" fill="#3D405B">Tenant notice:</text><text x="678" y="554" font-size="25" fill="#3D405B">2 months</text><circle cx="656" cy="610" r="7" fill="#2a5298"/><text x="678" y="618" font-size="25" fill="#3D405B">Compensation if not renewed:</text><text x="678" y="648" font-size="25" fill="#3D405B">at least 12 months&#x27; rent</text><rect x="60" y="690" width="640" height="48" rx="24" fill="#ef4444"/><text x="380" y="723" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Repealed by Congress on 2 October 2026</text><text x="1140" y="723" text-anchor="end" font-size="22" fill="#64748b">Source: BOE</text></g></svg>