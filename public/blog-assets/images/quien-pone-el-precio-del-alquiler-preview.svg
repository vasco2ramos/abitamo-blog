<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Viviendas terminadas en España: unas 309.000 en 1997, 658.510 en 2006, unas 41.000 en 2016 y unas 92.000 en 2025, frente a 240.000 hogares nuevos y un déficit de 750.000 viviendas">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3D405B" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- soft decorative circles -->
  <circle cx="120" cy="140" r="200" fill="#ffffff" fill-opacity="0.55" />
  <circle cx="1500" cy="820" r="240" fill="#f59e0b" fill-opacity="0.07" />

  <!-- dim skyline -->
  <g fill="#CBD5E1" fill-opacity="0.55">
    <rect x="0" y="820" width="94" height="80" /><rect x="100" y="850" width="114" height="50" /><rect x="220" y="810" width="54" height="90" /><rect x="280" y="790" width="54" height="110" /><rect x="340" y="810" width="54" height="90" /><rect x="400" y="850" width="74" height="50" /><rect x="480" y="760" width="54" height="140" /><rect x="540" y="850" width="114" height="50" /><rect x="660" y="850" width="74" height="50" /><rect x="740" y="850" width="114" height="50" /><rect x="860" y="820" width="54" height="80" /><rect x="920" y="810" width="54" height="90" /><rect x="980" y="850" width="114" height="50" /><rect x="1100" y="850" width="74" height="50" /><rect x="1180" y="790" width="74" height="110" /><rect x="1260" y="820" width="114" height="80" /><rect x="1380" y="810" width="54" height="90" /><rect x="1440" y="810" width="94" height="90" /><rect x="1540" y="850" width="74" height="50" />
  </g>

  <!-- idle crane, line art -->
  <g stroke="#94A3B8" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 1330 470 L 1330 110" />
    <path d="M 1190 130 L 1520 130" />
    <path d="M 1330 110 L 1250 130 M 1330 110 L 1450 130" stroke-width="3" />
    <path d="M 1300 470 L 1360 470" />
    <path d="M 1480 130 L 1480 230" stroke-width="3" />
    <path d="M 1480 230 q 0 16 -12 16" stroke-width="4" />
    <rect x="1196" y="132" width="40" height="34" rx="4" fill="#94A3B8" fill-opacity="0.35" stroke-width="3" />
  </g>

  <!-- main chart card -->
  <g transform="translate(150 150) rotate(-2)" filter="url(#shadow)">
    <rect x="0" y="0" width="900" height="610" rx="28" fill="#ffffff" />
    <rect x="60" y="500" width="780" height="2" fill="#3D405B" fill-opacity="0.25" />
    <rect x="90" y="312" width="120" height="188" rx="10" fill="#94A3B8" />
    <text x="150" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#3D405B">309k</text>
    <text x="150" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#3D405B" fill-opacity="0.6">1997</text>
    <rect x="280" y="100" width="120" height="400" rx="10" fill="#334155" />
    <text x="340" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#3D405B">659k</text>
    <text x="340" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#3D405B" fill-opacity="0.6">2006</text>
    <rect x="470" y="475" width="120" height="25" rx="10" fill="#94A3B8" />
    <text x="530" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#3D405B">41k</text>
    <text x="530" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#3D405B" fill-opacity="0.6">2016</text>
    <rect x="660" y="444" width="120" height="56" rx="10" fill="#f59e0b" />
    <text x="720" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#d97706">92k</text>
    <text x="720" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#3D405B" fill-opacity="0.6">2025</text>
    <!-- new households per year, dashed ghost line over 2025 -->
    <path d="M 630 354 L 810 354" stroke="#d97706" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round" />
    <g transform="translate(812 308)">
      <path d="M 0 22 L 22 4 L 44 22 L 44 46 L 0 46 Z" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linejoin="round" />
      <rect x="16" y="30" width="12" height="16" fill="#d97706" />
    </g>
    <text x="834" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#d97706">240k</text>
  </g>

  <!-- side panel: accumulated shortfall -->
  <g transform="translate(1150 500)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="270" rx="22" fill="#ffffff" />
    <g transform="translate(160 66)">
      <path d="M -30 2 L 0 -26 L 30 2 L 30 34 L -30 34 Z" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="9 7" stroke-linejoin="round" />
    </g>
    <text x="160" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#d97706">750k</text>
    <rect x="30" y="200" width="260" height="1.5" fill="#3D405B" fill-opacity="0.12" />
    <text x="160" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#3D405B" fill-opacity="0.65">2021 · 2025</text>
  </g>
</svg>
