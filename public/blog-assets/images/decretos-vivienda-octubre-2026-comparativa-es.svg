<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qué dicen los nuevos decretos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><g font-family="Arial, sans-serif"><rect width="1200" height="760" rx="24" fill="#f1f5f9"/><text x="60" y="95" font-size="46" font-weight="700" fill="#1e3c72">Qué dicen los nuevos decretos</text><rect x="60" y="150" width="520" height="520" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="60" y="150" width="520" height="100" rx="26" fill="#1e3c72"/><rect x="60" y="210" width="520" height="40" fill="#1e3c72"/><text x="90" y="198" font-size="34" font-weight="700" fill="#fff">RDL 29/2026</text><text x="90" y="232" font-size="22" fill="#fff" fill-opacity="0.85">Rentas, prórroga y desahucios</text><circle cx="96" cy="298" r="7" fill="#1e3c72"/><text x="118" y="306" font-size="25" fill="#3D405B">Subida de renta: máximo 2%</text><text x="118" y="336" font-size="25" fill="#3D405B">o el IRAV si es menor</text><circle cx="96" cy="388" r="7" fill="#1e3c72"/><text x="118" y="396" font-size="25" fill="#3D405B">Prórroga extraordinaria:</text><text x="118" y="426" font-size="25" fill="#3D405B">hasta 2 años</text><circle cx="96" cy="478" r="7" fill="#1e3c72"/><text x="118" y="486" font-size="25" fill="#3D405B">Desahucios de vulnerables</text><text x="118" y="516" font-size="25" fill="#3D405B">suspendidos hasta 2030</text><circle cx="96" cy="568" r="7" fill="#1e3c72"/><text x="118" y="576" font-size="25" fill="#3D405B">Compras especulativas:</text><text x="118" y="606" font-size="25" fill="#3D405B">solo por debajo del 70%</text><text x="118" y="636" font-size="25" fill="#3D405B">del valor, hasta 2030</text><rect x="620" y="150" width="520" height="520" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="620" y="150" width="520" height="100" rx="26" fill="#2a5298"/><rect x="620" y="210" width="520" height="40" fill="#2a5298"/><text x="650" y="198" font-size="34" font-weight="700" fill="#fff">RDL 28/2026</text><text x="650" y="232" font-size="22" fill="#fff" fill-opacity="0.85">Estabilidad del contrato</text><circle cx="656" cy="298" r="7" fill="#2a5298"/><text x="678" y="306" font-size="25" fill="#3D405B">Renovación automática:</text><text x="678" y="336" font-size="25" fill="#3D405B">5 años (7 si el propietario</text><text x="678" y="366" font-size="25" fill="#3D405B">es una empresa)</text><circle cx="656" cy="418" r="7" fill="#2a5298"/><text x="678" y="426" font-size="25" fill="#3D405B">Preaviso del propietario:</text><text x="678" y="456" font-size="25" fill="#3D405B">6 meses</text><circle cx="656" cy="508" r="7" fill="#2a5298"/><text x="678" y="516" font-size="25" fill="#3D405B">Preaviso del inquilino:</text><text x="678" y="546" font-size="25" fill="#3D405B">2 meses</text><circle cx="656" cy="598" r="7" fill="#2a5298"/><text x="678" y="606" font-size="25" fill="#3D405B">Indemnización si no renueva:</text><text x="678" y="636" font-size="25" fill="#3D405B">al menos 12 mensualidades</text><rect x="60" y="690" width="400" height="48" rx="24" fill="#10b981"/><text x="260" y="722" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">En vigor desde el 8 oct</text><rect x="480" y="690" width="470" height="48" rx="24" fill="#f59e0b"/><text x="715" y="722" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Previsto: 15 nov, si se convalida</text><text x="1140" y="722" text-anchor="end" font-size="22" fill="#64748b">Fuente: BOE</text></g></svg>