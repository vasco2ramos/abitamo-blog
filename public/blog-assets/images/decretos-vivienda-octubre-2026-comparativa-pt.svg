<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="O que dizem os novos decretos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><g font-family="Arial, sans-serif"><rect width="1200" height="760" rx="24" fill="#f1f5f9"/><text x="60" y="95" font-size="46" font-weight="700" fill="#1e3c72">O que dizem os novos decretos</text><rect x="60" y="150" width="520" height="520" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="60" y="150" width="520" height="100" rx="26" fill="#1e3c72"/><rect x="60" y="210" width="520" height="40" fill="#1e3c72"/><text x="90" y="198" font-size="34" font-weight="700" fill="#fff">RDL 29/2026</text><text x="90" y="232" font-size="22" fill="#fff" fill-opacity="0.85">Rendas, prorrogação e despejos</text><circle cx="96" cy="298" r="7" fill="#1e3c72"/><text x="118" y="306" font-size="25" fill="#3D405B">Aumento da renda: máximo 2%</text><text x="118" y="336" font-size="25" fill="#3D405B">ou o IRAV se for inferior</text><circle cx="96" cy="388" r="7" fill="#1e3c72"/><text x="118" y="396" font-size="25" fill="#3D405B">Prorrogação extraordinária:</text><text x="118" y="426" font-size="25" fill="#3D405B">até 2 anos</text><circle cx="96" cy="478" r="7" fill="#1e3c72"/><text x="118" y="486" font-size="25" fill="#3D405B">Despejos de vulneráveis</text><text x="118" y="516" font-size="25" fill="#3D405B">suspensos até 2030</text><circle cx="96" cy="568" r="7" fill="#1e3c72"/><text x="118" y="576" font-size="25" fill="#3D405B">Compras especulativas:</text><text x="118" y="606" font-size="25" fill="#3D405B">só abaixo de 70% do valor,</text><text x="118" y="636" font-size="25" fill="#3D405B">até 2030</text><rect x="620" y="150" width="520" height="520" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><rect x="620" y="150" width="520" height="100" rx="26" fill="#2a5298"/><rect x="620" y="210" width="520" height="40" fill="#2a5298"/><text x="650" y="198" font-size="34" font-weight="700" fill="#fff">RDL 28/2026</text><text x="650" y="232" font-size="22" fill="#fff" fill-opacity="0.85">Estabilidade do contrato</text><circle cx="656" cy="298" r="7" fill="#2a5298"/><text x="678" y="306" font-size="25" fill="#3D405B">Renovação automática:</text><text x="678" y="336" font-size="25" fill="#3D405B">5 anos (7 se o senhorio</text><text x="678" y="366" font-size="25" fill="#3D405B">for uma empresa)</text><circle cx="656" cy="418" r="7" fill="#2a5298"/><text x="678" y="426" font-size="25" fill="#3D405B">Aviso do senhorio:</text><text x="678" y="456" font-size="25" fill="#3D405B">6 meses</text><circle cx="656" cy="508" r="7" fill="#2a5298"/><text x="678" y="516" font-size="25" fill="#3D405B">Aviso do inquilino:</text><text x="678" y="546" font-size="25" fill="#3D405B">2 meses</text><circle cx="656" cy="598" r="7" fill="#2a5298"/><text x="678" y="606" font-size="25" fill="#3D405B">Indemnização se não renova:</text><text x="678" y="636" font-size="25" fill="#3D405B">pelo menos 12 rendas</text><rect x="60" y="690" width="400" height="48" rx="24" fill="#10b981"/><text x="260" y="722" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Em vigor desde 8 out</text><rect x="480" y="690" width="470" height="48" rx="24" fill="#f59e0b"/><text x="715" y="722" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Previsto: 15 nov, se convalidado</text><text x="1140" y="722" text-anchor="end" font-size="22" fill="#64748b">Fonte: BOE</text></g></svg>