name = "abitamo-blog"
compatibility_date = "2026-09-01"

# Cloudflare's Git-connected Pages build runs `npx wrangler deploy` as its
# deploy step (the unified Workers/Pages CLI), which needs an [assets]
# block -- the old `pages_build_output_dir` key alone isn't enough and
# makes that command fail with "Missing entry-point ... or to assets
# directory" since there's no Worker script here, only static output.
[assets]
directory = "./dist"
# Astro is configured with trailingSlash: 'never', so canonical/hreflang
# URLs (and every internal link) have no trailing slash. The default
# "auto-trailing-slash" handling 307-redirects those to a trailing-slash
# URL before serving 200, which fights the declared canonical once this
# sits behind abitamo.com/blog/*. "drop-trailing-slash" serves the
# extensionless URL directly instead.
html_handling = "drop-trailing-slash"
