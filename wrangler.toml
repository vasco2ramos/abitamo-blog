name = "abitamo-blog"
main = "worker/index.js"
compatibility_date = "2026-09-01"

# The blog is served at abitamo.com/{es,pt,en}/blog by the Rails app, which
# proxies those paths to this Worker. (Zone routes on abitamo.com do not
# work: the apex is proxied to Render, which sits behind its own Cloudflare
# network, so zone Workers never run there.)
#
# The proxy calls the workers.dev URL, not blog-origin.abitamo.com: that
# hostname is in the abitamo.com zone, whose bot protection returns a
# "Just a moment..." challenge to requests coming from Render's IPs.
# blog-origin.abitamo.com stays attached as a fallback.
#
# blog.abitamo.com stays attached only to 301 old URLs to their new address
# (see worker/index.js and worker/legacy-redirects.json).
#
# Must come before [assets] below -- TOML attaches trailing key=value lines
# to the last [table] header, so this would silently nest under [assets]
# otherwise.
workers_dev = true
routes = [
  { pattern = "blog.abitamo.com", custom_domain = true },
  { pattern = "blog-origin.abitamo.com", custom_domain = true },
]

# Cloudflare's Git-connected build runs `npx wrangler deploy`. The static
# output is served by the Worker itself through the ASSETS binding.
[assets]
directory = "./dist"
binding = "ASSETS"
# The Worker must see every request first: blog.abitamo.com needs to 301
# even paths that exist as files, and abitamo.com requests are filtered in
# code. Without this, a matching static file is served and the script skipped.
run_worker_first = true
# Astro is configured with trailingSlash: 'never', so canonical/hreflang
# URLs (and every internal link) have no trailing slash. The default
# "auto-trailing-slash" handling 307-redirects those to a trailing-slash
# URL before serving 200, which fights the declared canonical. This makes
# the extensionless URL serve 200 directly instead.
html_handling = "drop-trailing-slash"

# Branch builds run `npx wrangler preview`, which refuses to run without a
# `previews` block. Empty is enough: assets and compatibility settings stay
# at the top level.
[previews]
